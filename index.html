<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇妙动物园</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            background: #2d4a22; color: #fff; font-family: Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .top-bar {
            background: #1e3316; padding: 10px; display: flex; justify-content: space-around;
            font-size: 16px; font-weight: bold; border-bottom: 2px solid #3d632e;
        }
        .top-bar div span { color: #ffd700; }
        canvas {
            flex: 1; background: #6ab04c; display: block; width: 100%; height: 100%;
            touch-action: none;
        }
        .bottom-bar {
            background: #1e3316; padding: 15px; display: flex; gap: 10px; justify-content: center;
            border-top: 2px solid #3d632e;
        }
        button {
            background: #f0932b; color: #fff; border: none; border-radius: 8px;
            padding: 10px 15px; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #b36b1a; flex: 1; max-width: 120px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #b36b1a; }
        button:disabled { background: #555; box-shadow: 0 4px 0 #333; color: #aaa; }
        .buy-btn.tiger { background: #e67e22; box-shadow: 0 4px 0 #a85a15; }
        .buy-btn.panda { background: #9b59b6; box-shadow: 0 4px 0 #6c3d80; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>💰 金币: <span id="coins">0</span></div>
        <div>🎫 门票: <span id="ticket">10</span></div>
    </div>
    <canvas id="game"></canvas>
    <div class="bottom-bar">
        <button id="btn-rabbit" onclick="buyAnimal('rabbit')">买兔子(50)</button>
        <button id="btn-tiger" class="buy-btn tiger" onclick="buyAnimal('tiger')">买老虎(200)</button>
        <button id="btn-panda" class="buy-btn panda" onclick="buyAnimal('panda')">买熊猫(1000)</button>
    </div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const coinsEl = document.getElementById('coins');
    const ticketEl = document.getElementById('ticket');

    // 画布自适应大小
    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 游戏状态
    let gameData = {
        coins: 0,
        baseTicket: 10,
        animals: [], // {x, y, type, emoji, attract}
        trash: [],   // {x, y}
        floatTexts: [] // {x, y, text, color, alpha, vy}
    };

    // 动物配置
    const animalTypes = {
        rabbit: { price: 50, emoji: '🐰', attract: 5, color: '#fff' },
        tiger:  { price: 200, emoji: '🐯', attract: 20, color: '#e67e22' },
        panda:  { price: 1000, emoji: '🐼', attract: 100, color: '#9b59b6' }
    };

    // 更新门票价格
    function updateTicketPrice() {
        let totalAttract = gameData.animals.reduce((sum, a) => sum + a.attract, 0);
        let newTicket = gameData.baseTicket + Math.floor(totalAttract * 1.5);
        
        // 垃圾超过10个，环境恶化，票价减半
        if (gameData.trash.length > 10) {
            newTicket = Math.floor(newTicket * 0.5);
        }
        ticketEl.innerText = newTicket;
        return newTicket;
    }

    // 购买动物
    function buyAnimal(type) {
        const config = animalTypes[type];
        if (gameData.coins >= config.price) {
            gameData.coins -= config.price;
            gameData.animals.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: Math.random() * (canvas.height - 60) + 30,
                emoji: config.emoji,
                attract: config.attract
            });
            updateCoins();
            updateTicketPrice();
            
            // 买动物时有飘字
            addFloatText(canvas.width/2, canvas.height/2, `新动物入住!`, config.color);
        } else {
            addFloatText(canvas.width/2, canvas.height/2, `金币不足!`, '#ff4757');
        }
    }

    function updateCoins() {
        coinsEl.innerText = gameData.coins;
        // 更新按钮状态
        document.getElementById('btn-rabbit').disabled = gameData.coins < 50;
        document.getElementById('btn-tiger').disabled = gameData.coins < 200;
        document.getElementById('btn-panda').disabled = gameData.coins < 1000;
    }

    // 添加飘字特效
    function addFloatText(x, y, text, color = '#ffd700') {
        gameData.floatTexts.push({ x, y, text, color, alpha: 1, vy: -1 });
    }

    // 生成垃圾
    function spawnTrash() {
        if (gameData.trash.length < 20) {
            gameData.trash.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                emoji: ['💩', '🍌', '🗑️'][Math.floor(Math.random()*3)]
            });
            updateTicketPrice(); // 垃圾多了票价可能下降
        }
    }

    // 定时收入（游客买票）
    setInterval(() => {
        if (gameData.trash.length <= 10 && gameData.animals.length > 0) {
            let income = updateTicketPrice();
            gameData.coins += income;
            updateCoins();
            // 随机位置飘金币
            addFloatText(canvas.width / 2 + (Math.random()-0.5)*100, 50, `+${income} 金币`, '#ffd700');
        }
    }, 2000); // 每2秒收一次门票

    // 定时生成垃圾
    setInterval(spawnTrash, 3000);
    // 初始给几个垃圾
    spawnTrash(); spawnTrash(); spawnTrash();

    // 点击事件处理
    canvas.addEventListener('touchstart', handleInput, {passive: false});
    canvas.addEventListener('mousedown', handleInput);

    function handleInput(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;

        // 检测是否点中垃圾
        for (let i = gameData.trash.length - 1; i >= 0; i--) {
            let t = gameData.trash[i];
            let dist = Math.hypot(clickX - t.x, clickY - t.y);
            if (dist < 25) { // 点击判定范围
                gameData.trash.splice(i, 1);
                let reward = 5;
                gameData.coins += reward;
                updateCoins();
                addFloatText(t.x, t.y, `+${reward}`, '#fff');
                updateTicketPrice();
                break;
            }
        }
    }

    // 渲染循环
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 画草地格子纹理
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for(let j=0; j<canvas.height; j+=40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        // 画动物
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        gameData.animals.forEach(a => {
            ctx.fillText(a.emoji, a.x, a.y);
        });

        // 画垃圾
        ctx.font = '30px Arial';
        gameData.trash.forEach(t => {
            ctx.fillText(t.emoji, t.x, t.y);
        });

        // 画飘字
        ctx.font = 'bold 20px Arial';
        for (let i = gameData.floatTexts.length - 1; i >= 0; i--) {
            let f = gameData.floatTexts[i];
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.alpha;
            ctx.fillText(f.text, f.x, f.y);
            
            // 动画更新
            f.y += f.vy;
            f.alpha -= 0.02;
            
            // 移除透明文字
            if (f.alpha <= 0) gameData.floatTexts.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(draw);
    }

    updateCoins();
    draw();
</script>
</body>
</html>
